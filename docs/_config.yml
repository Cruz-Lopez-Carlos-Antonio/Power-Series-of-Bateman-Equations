title: Power Series of Bateman Equations
description: A novel power-series solution of the Bateman equations using the Mittag-Leffler function
theme: minima
markdown: kramdown

kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

permalink: /:basename:output_ext
